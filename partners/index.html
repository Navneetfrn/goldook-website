    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { background: #E7E2D8; font-family: 'DM Sans', sans-serif; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
      #root { -webkit-tap-highlight-color: transparent; }
      #root img { -webkit-touch-callout: none; -webkit-user-drag: none; }
      #root button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
      button, input, textarea, select { font-family: inherit; }
      button:active { opacity: 0.85; }
      /* Phone: the app fills the screen. */
      .gp-stage { height: 100%; }
      .gp-bezel { height: 100%; }
      .gp-phone { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      .gp-hint { display: none; }
      /* Computer: a phone-sized window in the middle. */
      @media (min-width: 640px) and (min-height: 620px) {
        .gp-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
          background: radial-gradient(circle at 30% 20%, #F3EEE4, #DCD5C8); }
        .gp-bezel { height: auto; padding: 10px; border-radius: 38px; background: #1E2326; box-shadow: 0 30px 60px rgba(0,0,0,0.25); }
        .gp-phone { width: 400px; height: min(860px, calc(100vh - 100px)); border-radius: 28px; transform: translateZ(0); }
        .gp-hint { display: block; margin: 16px 0 0; color: #6B7072; font-size: 12px; }
      }
      .gp-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); border-top-color: #C9A84C; animation: gp-spin 0.9s linear infinite; }
      @keyframes gp-spin { to { transform: rotate(360deg); } }
